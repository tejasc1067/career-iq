# Local development dependencies only.
#
# The frontend and backend run directly on the host for faster iteration
# (ARCHITECTURE.md section 42); Docker provides PostgreSQL with pgvector.
# Ollama also runs on the host when local model performance matters.

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: careeriq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careeriq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careeriq}
      POSTGRES_DB: ${POSTGRES_DB:-careeriq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careeriq} -d ${POSTGRES_DB:-careeriq}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
